<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Daily focus — before</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #eef2ff; color: #1e1b4b; }
    .phone { min-height: 100vh; padding: 42px 22px 24px; }
    .avatar { width: 44px; height: 44px; margin-left: auto; border-radius: 50%; background: linear-gradient(135deg, #818cf8, #ec4899); }
    h1 { margin: 48px 0 12px; font-size: 52px; background: linear-gradient(90deg, #4338ca, #db2777); -webkit-background-clip: text; color: transparent; }
    .intro { color: #6b7280; line-height: 1.6; }
    .cards { display: grid; gap: 14px; margin-top: 42px; }
    .card { padding: 22px; border-radius: 22px; background: white; box-shadow: 0 12px 30px #6366f133; }
    .card strong { display: block; margin-bottom: 8px; }
    .card span { color: #6b7280; font-size: 13px; }
    nav { display: flex; justify-content: space-around; margin: 44px -22px -24px; padding: 16px; background: white; box-shadow: 0 -10px 30px #6366f122; }
    @media (min-width: 700px) { .phone { width: 460px; margin: 0 auto; } }
  </style>
</head>
<body><main class="phone"><div class="avatar"></div><h1>Own your day</h1><p class="intro">A smarter, faster, better way to manage everything that matters.</p><section class="cards"><article class="card"><strong>Morning routine</strong><span>3 tasks remaining</span></article><article class="card"><strong>Team update</strong><span>Review your latest activity</span></article><article class="card"><strong>Focus time</strong><span>Plan your next deep-work block</span></article></section><nav><span>Home</span><span>Tasks</span><span>Profile</span></nav></main></body>
</html>
