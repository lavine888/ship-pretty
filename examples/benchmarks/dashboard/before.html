<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Release dashboard — before</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; color: white; background: #111827; }
    .shell { width: min(1100px, calc(100% - 32px)); margin: 0 auto; padding: 48px 0; }
    h1 { text-align: center; font-size: 52px; margin: 0 0 12px; background: linear-gradient(90deg, #fff, #93c5fd); -webkit-background-clip: text; color: transparent; }
    .intro { max-width: 560px; margin: 0 auto 42px; color: #cbd5e1; text-align: center; line-height: 1.6; }
    .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
    .card { padding: 24px; border: 1px solid #334155; border-radius: 22px; background: #1e293b; box-shadow: 0 18px 50px #02061788; }
    .card b { display: block; margin: 12px 0; font-size: 32px; }
    .card span { color: #94a3b8; font-size: 13px; }
    .table { margin-top: 28px; padding: 24px; border: 1px solid #334155; border-radius: 22px; background: #1e293b; box-shadow: 0 18px 50px #02061788; }
    .row { display: grid; grid-template-columns: 1fr 120px 100px; gap: 18px; padding: 14px 0; border-bottom: 1px solid #334155; color: #cbd5e1; }
    .row:last-child { border-bottom: 0; }
    @media (max-width: 720px) { .cards { grid-template-columns: 1fr; } .row { grid-template-columns: 1fr 80px; } .row span:last-child { display: none; } }
  </style>
</head>
<body>
  <main class="shell">
    <h1>Release dashboard</h1>
    <p class="intro">Everything you need to track your team's delivery and move faster with confidence.</p>
    <section class="cards"><article class="card"><span>Deployments</span><b>128</b><span>+24% this month</span></article><article class="card"><span>Success rate</span><b>98.4%</b><span>+3.2% this month</span></article><article class="card"><span>Team velocity</span><b>84</b><span>+18% this month</span></article></section>
    <section class="table"><div class="row"><strong>Web app v2.4</strong><span>Production</span><span>Healthy</span></div><div class="row"><strong>Mobile app v1.9</strong><span>Review</span><span>Pending</span></div><div class="row"><strong>API v3.1</strong><span>Staging</span><span>Healthy</span></div></section>
  </main>
</body>
</html>
